name: ridewealth_assistant
description: A financial assistant for rideshare and gig drivers.

publish_to: "none"

version: 1.0.33+33
homepage: https://www.ridewealthassistant.com

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.1"

dependencies:
  flutter:
    sdk: flutter
  english_words:
  provider:
  shared_preferences: ^2.3.3
  csv: ^7.1.0
  http: ^1.1.2
  intl: ^0.20.2
  universal_html: ^2.2.4
  path_provider: ^2.1.2
  collection: ^1.18.0
  fluttertoast: ^9.0.0
  url_launcher: ^6.3.1
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  supabase_flutter:
  connectivity_plus: ^7.0.0
  dynamic_color: ^1.6.8
  purchases_flutter: ^9.12.0
  flutter_plugin_android_lifecycle: ^2.0.15
  flutter_svg: ^2.0.9
  sentry_flutter: ^9.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/store/
    - assets/images/
    - assets/googlelogo.svg
    - assets/applelogo.svg

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/RWAlogo.png"
  web:
    generate: true
    image_path: "assets/images/RWAlogo.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
